name: Deploy FE to QA

on:
  push:
    branches: [QA]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_ENV: qa
          # Add any other env vars your app needs here

      - name: Deploy to Firebase QA
        run: npx firebase-tools deploy --only hosting --project z12-website --config firebase.qa.json
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}